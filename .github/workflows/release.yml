name: Release

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  check-version:
    if: "!startsWith(github.event.head_commit.message, 'chore: bump version')"
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
      ref: ${{ steps.check.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          token: ${{ secrets.GITHUB_TOKEN }}
      - id: check
        run: |
          set -e
          if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            CHANGED=$(git diff --name-only HEAD^ HEAD)
          else
            CHANGED=$(git show --pretty="" --name-only HEAD)
          fi

          is_release_relevant() {
            case "$1" in
              package.json|Cargo.toml|Cargo.lock|src-tauri/tauri.conf.json|src-tauri/Cargo.toml)
                return 0
                ;;
              *.js|*.mjs|*.cjs|*.rs|*.html|*.css)
                return 0
                ;;
              src-tauri/*|renderer/*|sidecar/*|crates/*|packaging/*|extensions/*)
                return 0
                ;;
            esac
            return 1
          }

          SHOULD_RELEASE=false
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            if is_release_relevant "$file"; then
              SHOULD_RELEASE=true
              break
            fi
          done <<< "$CHANGED"

          cargo_version() {
            awk '
              $0 == "[workspace.package]" { in_pkg = 1; next }
              in_pkg && /^\[/ { in_pkg = 0 }
              in_pkg && $1 == "version" {
                gsub(/"/, "", $3)
                print $3
                exit
              }
            ' Cargo.toml
          }

          if [ "$SHOULD_RELEASE" != true ]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "version=$(cargo_version)" >> "$GITHUB_OUTPUT"
            echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CURRENT=$(cargo_version)
          if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            OLD=$(git show HEAD^:Cargo.toml | awk '
              $0 == "[workspace.package]" { in_pkg = 1; next }
              in_pkg && /^\[/ { in_pkg = 0 }
              in_pkg && $1 == "version" {
                gsub(/"/, "", $3)
                print $3
                exit
              }
            ')
          else
            OLD=""
          fi

          if [ -n "$OLD" ] && [ "$OLD" = "$CURRENT" ]; then
            IFS=. read -r MAJ MIN PAT <<EOF
$CURRENT
EOF
            CURRENT="${MAJ}.${MIN}.$((PAT + 1))"
            sed -i "/^\\[workspace.package\\]/,/^\\[/{s/^version = \".*\"/version = \"$CURRENT\"/;}" Cargo.toml
            jq --arg v "$CURRENT" '.version = $v' package.json > package.json.tmp
            mv package.json.tmp package.json
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Cargo.toml package.json
            git commit -m "chore: bump version to ${CURRENT}"
            git push
          fi

          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "version=${CURRENT}" >> "$GITHUB_OUTPUT"
          echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build-and-release:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: --bundles nsis
          - platform: macos-latest
            args: --bundles dmg
          - platform: ubuntu-22.04
            args: --bundles appimage,deb
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout app
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-version.outputs.ref }}
          path: app
      - name: Checkout tauri-tray-base
        uses: actions/checkout@v4
        with:
          repository: taylorivanoff/tauri-tray-base
          path: tauri-tray-base
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: oven-sh/setup-bun@v2
      - name: Install frontend deps
        working-directory: app
        run: bun install
      - name: Skip updater artifacts without signing key
        working-directory: app
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            jq '.bundle.createUpdaterArtifacts = false' src-tauri/tauri.conf.json > src-tauri/tauri.conf.json.tmp
            mv src-tauri/tauri.conf.json.tmp src-tauri/tauri.conf.json
            echo "No TAURI_SIGNING_PRIVATE_KEY — disabled createUpdaterArtifacts"
          else
            echo "TAURI_SIGNING_PRIVATE_KEY present — updater artifacts enabled"
          fi
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tagName: v__VERSION__
          releaseName: v__VERSION__
          releaseBody: "See the assets below to download and install."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
      - name: Build CLI binary
        working-directory: app
        run: cargo build --release -p gh-stats-cli
      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: gh-stats-cli-${{ matrix.platform }}
          path: |
            app/target/release/gh-stats-cli
            app/target/release/gh-stats-cli.exe
          if-no-files-found: warn
