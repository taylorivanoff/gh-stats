<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #f5f5f7;
      background-color: #1c1c1e;
      background-image: radial-gradient(circle at 50% 25%, #2b5870 0%, #19242d 42%, #101114 100%);
      user-select: none;
    }
    .splash-content {
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .icon { width: 88px; height: 88px; margin-bottom: 18px; border-radius: 20px; }
    .title { font-size: 22px; font-weight: 650; margin-bottom: 6px; }
    .subtitle { font-size: 13px; opacity: 0.7; margin-bottom: 26px; }
    .loader {
      width: 28px; height: 28px;
      border: 2.5px solid rgba(255,255,255,0.15);
      border-top-color: #4cc2ff;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <main class="splash-content">
    <img class="icon" src="icon.png" alt="GhStats">
    <div class="title">GhStats</div>
    <div class="subtitle">Loading analytics…</div>
    <div class="loader"></div>
  </main>
</body>
</html>
