[workspace]
members = ["crates/gh-stats-core", "crates/gh-stats-cli", "src-tauri"]
resolver = "2"

# Single source of truth for the app version.
# - src-tauri and gh-stats-core inherit via version.workspace = true
# - tauri.conf.json omits version so the bundle uses this Cargo version
# - package.json is a mirror for bun/npm (updated by scripts/bump-version.cjs)
[workspace.package]
version = "1.1.2"
edition = "2021"
authors = ["Taylor Ivanoff"]
license = "MIT"
